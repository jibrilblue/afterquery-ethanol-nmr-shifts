schema_version = "1.4"

artifacts = ["/app/output/thermo.json"]

[task]
name = "afterquery/isoprene-maleic-ts"
description = "Compute the Gibbs free energy of activation and reaction for the endo Diels-Alder reaction of isoprene with maleic anhydride."
authors = [{ name = "Jibril Suleiman Lere", email = "jibrilesslere@gmail.com" }]
keywords = ["DFT", "thermochemistry", "transition state", "Diels-Alder", "PySCF"]

[metadata]
author_name = "Jibril Suleiman Lere"
author_email = "jibrilesslere@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://orcid.org/0009-0007-1405-2206"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "physical-sciences"
field = "chemistry"
subfield = "computational chemistry"
category = "Science"
subcategory = "Chemistry"
tags = ["DFT", "thermochemistry", "transition state", "Diels-Alder", "PySCF"]
expert_time_estimate_hours = 12.0
relevant_experience = "Extensive experience in computational chemistry, transition state searching, and thermochemical analysis using DFT."
difficulty_explanation = "The difficulty comes from a chain of expert decisions where each mistake silently shifts the answer by several kcal/mol: locating the correct endo TS vs exo, navigating the steric clash of the methyl group, skipping quasi-RRHO corrections, omitting the standard-state correction, or referencing a complex instead of the separated reactants."
solution_explanation = "Optimize the reactants and product. Locate the endo TS and confirm it has exactly one imaginary frequency. Compute G(298.15 K) using Grimme’s quasi-RRHO treatment and calculate ΔG‡ and ΔG_rxn."
verification_explanation = "The verifier physically recomputes the Hessian on the agent's submitted TS geometry, checks the endo projection, and verifies connectivity. It checks ΔG‡ and ΔG_rxn against reference values."

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

