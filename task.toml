category = "Science"
subcategory = "Chemistry"
tags = ["DFT", "thermochemistry", "transition state", "Diels-Alder", "PySCF"]
expert_time_estimate_hours = 12.0
relevant_experience = "Extensive experience in computational chemistry, transition state searching, and thermochemical analysis using DFT."
difficulty_explanation = "The difficulty comes from a chain of expert decisions where each mistake silently shifts the answer by several kcal/mol."
solution_explanation = "Optimize the reactants and the cyclohexene product. Locate the concerted transition state and confirm it has exactly one imaginary frequency. Compute G(298.15 K) using Grimme’s quasi-RRHO treatment and calculate ΔG‡ and ΔG_rxn."
verification_explanation = "The verifier checks ΔG‡ and ΔG_rxn within ±0.5 kcal/mol, the imaginary frequency within ±75 cm⁻¹, and the forming C-C distances within ±0.05 Å."

