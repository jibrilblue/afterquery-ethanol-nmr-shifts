schema_version = "1.4"

artifacts = ["/app/output/vmc.json"]

[task]
name = "afterquery/h2o-vmc-correlation"
description = "Calculate the correlation energy recovered by a two-body Slater-Jastrow Variational Monte Carlo (VMC) simulation for the H2O molecule."
authors = [{ name = "Jibril Suleiman Lere", email = "jibrilesslere@gmail.com" }]
keywords = ["quantum Monte Carlo", "VMC", "Jastrow factor", "correlation energy", "water"]

[metadata]
author_name = "Jibril Suleiman Lere"
author_email = "jibrilesslere@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://orcid.org/0009-0007-1405-2206"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "physical-sciences"
field = "chemistry"
subfield = "electronic structure and quantum Monte Carlo"
category = "Science"
subcategory = "Chemistry"
tags = ["quantum Monte Carlo", "VMC", "Jastrow factor", "correlation energy", "PyQMC"]
expert_time_estimate_hours = 6.0
relevant_experience = "Six years of electronic structure research with a focus on real-space quantum Monte Carlo methods; I develop and apply Slater-Jastrow trial wavefunctions and run VMC calculations for small molecules."
difficulty_explanation = "The task requires the agent to set up a full QMC pipeline from scratch: run RHF, construct a Slater-Jastrow wavefunction, optimize the Jastrow parameters to recover correlation energy, and run a converged VMC simulation. The challenge lies in properly equilibrating the walkers, choosing sufficient sampling blocks, and ensuring the variational energy is strictly below the HF baseline without falling into statistical noise."
solution_explanation = "Load the RHF checkpoint with PySCF. Build a Slater-Jastrow trial wavefunction using PyQMC's default two-body Jastrow. Optimize the Jastrow parameters. Run a converged VMC simulation with sufficient walkers and blocks. Compute the correlation energy as E_vmc - E_hf. Ensure the random seed is fixed for reproducibility."
verification_explanation = "The verifier runs offline against a baked-in ground_truth.json. It checks the correlation energy within a tight tolerance derived from the statistical error of the reference run. It also enforces the variational bound, ensuring the agent's VMC energy is strictly lower than the HF energy, preventing trivial cheating."

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 14400.0

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "public"
