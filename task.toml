domain = "physical-sciences"
field = "chemistry"
subfield = "computational chemistry"
category = "Science"
subcategory = "Chemistry"
tags = ["NMR", "GIAO", "DFT", "PySCF"]
expert_time_estimate_hours = 4.0
relevant_experience = "Extensive experience in computational chemistry and magnetic resonance property calculations using DFT."
difficulty_explanation = "The task requires setting up GIAO NMR calculations for both the target molecule and the TMS reference standard, and correctly extracting and referencing the isotropic shielding tensors to obtain chemical shifts."
solution_explanation = "Optimize the geometries of ethanol and TMS. Run GIAO-B3LYP calculations to get isotropic shielding tensors. Calculate the shifts as sigma_TMS - sigma_sample."
verification_explanation = "The verifier checks the chemical shifts against reference values with a strict tolerance."

