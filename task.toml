schema_version = "1.4"

artifacts = ["/app/output/nmr.json"]

[task]
name = "afterquery/ethanol-nmr-shifts"
description = "Calculate the 1H and 13C NMR chemical shifts for ethanol using GIAO-B3LYP."
authors = [{ name = "Jibril Suleiman Lere", email = "jibrilesslere@gmail.com" }]
keywords = ["NMR", "GIAO", "chemical shifts", "DFT", "PySCF"]

[metadata]
author_name = "Jibril Suleiman Lere"
