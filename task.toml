schema_version = "1.4"

artifacts = ["/app/output/dmc.json"]

[task]
name = "afterquery/fixed-node-dmc"
description = "Optimize a Slater-Jastrow trial wavefunction for CO, run VMC and fixed-node DMC, and quantify the fixed-node error by comparing single-reference and multi-reference trial wavefunctions."
authors = [{ name = "Jibril Suleiman Lere", email = "jibrilesslere@gmail.com" }]
keywords = ["quantum Monte Carlo", "diffusion Monte Carlo", "fixed-node error", "Jastrow factor", "electronic structure"]

[metadata]
author_name = "Jibril Suleiman Lere"
author_email = "jibrilesslere@gmail.com"
author_organization = "Independent"
author_profile = "https://orcid.org/0009-0007-1405-2206"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "physical-sciences"
field = "chemistry"
subfield = "electronic structure and quantum Monte Carlo"
category = "Science"
subcategory = "Chemistry"
tags = ["quantum Monte Carlo", "diffusion Monte Carlo", "fixed-node error", "Jastrow factor", "electronic structure", "PyQMC"]
expert_time_estimate_hours = 8.0
relevant_experience = "Six years of electronic structure research with a focus on real-space quantum Monte Carlo methods; I develop and apply Slater-Jastrow trial wavefunctions, run VMC and DMC calculations for small molecules, and analyze fixed-node errors in systems with strong static correlation."
difficulty_explanation = "The checkpoint file is author-generated and the Jastrow parameters are specific to it, so the answer is not findable online. The task is hard because it requires four dependent stages that each fail silently: Jastrow optimization (a naive optimization produces a poor trial wavefunction and biases both VMC and DMC), VMC equilibration (insufficient equilibration leaves walkers in a non-equilibrium distribution), DMC branching (a time step that is too large introduces a bias, and one that is too small requires prohibitive run times), and the fixed-node error estimate (which requires a separate multi-reference calculation that agents often skip). No information an expert would obviously have is withheld, and every step is standard QMC practice."
solution_explanation = "Load the RHF checkpoint with PySCF. Build a Slater-Jastrow trial wavefunction using PyQMC's default two-body Jastrow. Optimize the Jastrow parameters by VMC energy minimization with a sufficiently large sample. Run VMC with the optimized trial, equilibrate for a few thousand steps, and accumulate the energy. Run fixed-node DMC with a time step of 0.01 a.u., discarding the first 20 percent of steps for equilibration and accumulating the energy over the remainder. Build a multi-reference trial from a CAS(2,2) expansion, optimize its Jastrow, and run a second fixed-node DMC. Report all energies, the Jastrow parameters, the statistical errors, and the difference between the two DMC energies as the fixed-node error."
verification_explanation = "The verifier runs offline in a separate container against a baked-in ground_truth.json holding the author's independently computed values on the same checkpoint file. Ground truth comes from the author's own high-precision PyQMC calculation, never from the reference solution. Absolute energies are compared with a tolerance that absorbs a constant offset from a different Jastrow parameterization; the fixed-node error is compared directly. Statistical errors are checked to be smaller than the reported differences. A solution that skips the multi-reference calculation fails the fixed-node error check."

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
